app {
  name = "EcommerceAnalytics"

  spark {
    master = "local[*]"
    shuffle.partitions = 8
  }

  optimization {
    enable-cache = true
    enable-broadcast = true
  }

  data {
    input {
      transactions = "data/transactions.csv"
      users = "data/users.json"
      products = "data/products.parquet"
      merchants = "data/merchants.csv"
    }

    output {
      quality-report = "output/data_quality_report"
    }
  }

  validation {
    transaction {
      min-amount-exclusive = 0.0
      timestamp-length = 14
    }
    user {
      min-age = 16
      max-age = 100
      min-annual-income-exclusive = 0.0
    }
    product {
      min-price-exclusive = 0.0
      min-rating = 1.0
      max-rating = 5.0
    }
    merchant {
      min-commission-rate = 0.0
      max-commission-rate = 1.0
    }
  }
}
